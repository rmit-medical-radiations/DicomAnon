name: Build Windows Release

on:
  push:
    tags:
      - 'v*'   # Triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Cheap check against the installed packages, before spending a build on
      # them. Catches a Qt/bindings mismatch with a readable console traceback.
      - name: Self-test the dependencies
        run: python DicomAnon.py --self-test

      # The anonymisation checks themselves: contamination, date shifting, the lookup
      # file, and UID stability across runs. Runs before the build, because a broken
      # check is worse than a broken build - it ships output nobody verifies.
      - name: Run the anonymisation tests
        run: python tests/run_all.py

      - name: Build with PyInstaller
        run: pyinstaller DicomAnon-Windows.spec

      # The EXE is built windowed (console=False), so an import-time crash puts
      # up PyInstaller's modal "Unhandled exception in script" dialog and the
      # process sits there alive. A test that only checks the process is still
      # running therefore passes on a completely broken build - that is how the
      # v0.4 and v0.5 EXEs shipped. Wait on the exit code instead, and treat
      # "still running" as the failure it is.
      - name: Self-test EXE
        shell: pwsh
        timeout-minutes: 3
        run: |
          $report = "$PWD\self-test-report.txt"

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = "$PWD\dist\DicomAnon.exe"
          $psi.Arguments = "--self-test `"$report`""
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)

          if (-not $proc.WaitForExit(60000)) {
            $proc.Kill()
            Write-Error "DicomAnon.exe --self-test did not exit within 60s - it is most likely showing the windowed exception dialog. Packaging is broken."
            exit 1
          }

          if (Test-Path $report) { Get-Content $report | Write-Host }

          if ($proc.ExitCode -ne 0) {
            Write-Error "DicomAnon.exe --self-test failed (exit code $($proc.ExitCode))"
            exit 1
          }
          Write-Host "Self-test passed"

      # The self-test runs offscreen, so it never loads the Windows platform
      # plugin. Launch the real GUI as well to cover qwindows.dll.
      - name: Smoke test the GUI
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\DicomAnon.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            Write-Error "DicomAnon.exe exited early (exit code $($proc.ExitCode)) - packaging likely failed"
            exit 1
          }

          $proc.Refresh()
          $title = $proc.MainWindowTitle
          Write-Host "Main window title: '$title'"
          if ($title -match 'Unhandled exception|Fatal Error|Failed to execute') {
            Stop-Process -Id $proc.Id -Force
            Write-Error "DicomAnon.exe is showing an error dialog: '$title'"
            exit 1
          }

          Stop-Process -Id $proc.Id -Force
          Write-Host "Smoke test passed - GUI ran for 8 seconds without crashing"

      - name: Upload EXE to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Don't abort the step when gh returns non-zero; we handle it below.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          # The macOS job may have created the release already, in which case
          # this fails harmlessly and we just add our asset to the release.
          gh release create ${{ github.ref_name }} `
            --title "${{ github.ref_name }}" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { Write-Host "Release already exists - uploading asset to it" }

          gh release upload ${{ github.ref_name }} dist/DicomAnon.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload DicomAnon.exe to the release" }
