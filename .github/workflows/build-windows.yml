name: Build Windows Release

on:
  push:
    tags:
      - 'v*'   # Triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller DicomAnon-Windows.spec

      - name: Smoke test EXE
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\DicomAnon.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "DicomAnon.exe exited early (exit code $($proc.ExitCode)) — packaging likely failed"
            exit 1
          }
          Stop-Process -Id $proc.Id
          Write-Host "Smoke test passed — EXE ran for 5 seconds without crashing"

      - name: Upload EXE to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} dist/DicomAnon.exe `
            --title "${{ github.ref_name }}" `
            --generate-notes