name: Build macOS Release

on:
  push:
    tags:
      - 'v*'   # Triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Cheap check against the installed packages, before spending a build on
      # them. Catches a Qt/bindings mismatch with a readable console traceback.
      - name: Self-test the dependencies
        run: python DicomAnon.py --self-test

      - name: Build with PyInstaller
        run: pyinstaller DicomAnon.spec

      - name: Self-test app bundle
        timeout-minutes: 3
        run: dist/DicomAnon.app/Contents/MacOS/DicomAnon --self-test

      - name: Smoke test app bundle
        run: |
          dist/DicomAnon.app/Contents/MacOS/DicomAnon &
          PID=$!
          sleep 5
          if ! kill -0 $PID 2>/dev/null; then
            echo "DicomAnon exited early — packaging likely failed"
            exit 1
          fi
          kill $PID
          echo "Smoke test passed — app ran for 5 seconds without crashing"

      - name: Zip the app bundle
        run: |
          cd dist
          ditto -c -k --keepParent DicomAnon.app DicomAnon-macOS.zip

      - name: Upload app to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Windows job may have created the release already; ignore the
          # failure in that case and just add our asset to it.
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes || true
          gh release upload "${{ github.ref_name }}" \
            dist/DicomAnon-macOS.zip --clobber
